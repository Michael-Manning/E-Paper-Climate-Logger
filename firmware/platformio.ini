
[platformio]
build_cache_dir = buildCache/
; With two [env:] sections defined, a plain "Upload"/"Build" (no explicit -e) would otherwise
; target both and fight over the serial port. Pin the default so only the real firmware gets
; that treatment; hwtest stays reachable via its explicit "pio test -e hwtest".
default_envs = templog-esp-s3

[env:templog-esp-s3]
; Arduino 2.0.17 includes the ESP32-S3 ANY_LOW wakeup API used by the firmware.
platform = espressif32@6.12.0
board = templog-v1
board_build.arduino.memory_type = qio_qspi
framework = arduino
monitor_speed = 115200
build_unflags = 
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
build_flags = 
	-DCORE_DEBUG_LEVEL=ESP_LOG_ERROR
	-DBOARD_HAS_NO_PSRAM
    ; GCC 8 uses the draft C++20 flag spelling.
    -std=gnu++2a
lib_deps = zinggjm/GxEPD2@^1.6.4

extra_scripts = pre:extra_script.py

; Hardware bring-up test suites for freshly assembled PCBs, run via PlatformIO's Unity test
; runner. Each directory under test/ exercises one component (EEPROM, RTC, climate sensor,
; fuel gauge, buttons, USB/charge pins, display) directly against the real drivers, independent
; of the main application's state machine.
;
; Run all suites:      pio test -e hwtest
; Run a single suite:  pio test -e hwtest -f test_eeprom

[env:hwtest]
platform = espressif32@6.12.0
board = templog-v1
board_build.arduino.memory_type = qio_qspi
framework = arduino
monitor_speed = 115200
build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
build_flags =
	-DCORE_DEBUG_LEVEL=ESP_LOG_ERROR
	-DBOARD_HAS_NO_PSRAM
    -std=gnu++2a
lib_deps = zinggjm/GxEPD2@^1.6.4
; pull the real drivers (src/drivers, buttons.cpp, platform.cpp, power.cpp) into each test
; binary, but exclude main.cpp/app.cpp since every test suite defines its own setup()/loop().
test_build_src = yes
build_src_filter = +<*> -<main.cpp> -<app.cpp>
